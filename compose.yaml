services:
  archiveplayer:
    build: .
    image: ghcr.io/lovelesscodes/archiveplayer:latest
    container_name: archiveplayer
    restart: unless-stopped
    ports:
      # Keep this localhost-only and put a TLS reverse proxy in front for
      # access from other devices. Change to "8080:8080" only on a trusted LAN.
      - "127.0.0.1:8080:8080"
    environment:
      ARCHIVEPLAYER_ALLOW_REGISTRATION: "false"
      ARCHIVEPLAYER_SECURE_COOKIES: "false"
      ARCHIVEPLAYER_SESSION_DAYS: "30"
      ARCHIVEPLAYER_DEVICE_SESSION_DAYS: "180"
      # mDNS needs host networking or a host-side Avahi reflector.
      ARCHIVEPLAYER_MDNS: "false"
      # ARCHIVEPLAYER_SERVER_NAME: "Living Room NAS"
      # ARCHIVEPLAYER_PUBLIC_URL: "https://media.example.com"
      # ARCHIVEPLAYER_TRUST_PROXY: "true"
      # ARCHIVEPLAYER_CORS_ORIGINS: "https://tv.example.com,null"
      # ARCHIVEPLAYER_RATE_LIMIT_PER_MINUTE: "240"
      # ARCHIVEPLAYER_AUTH_RATE_LIMIT_PER_MINUTE: "10"
      # ARCHIVEPLAYER_DEVICE_RATE_LIMIT_PER_MINUTE: "60"
      RUST_LOG: "archiveplayer_server=info,tower_http=warn"
    volumes:
      - archiveplayer-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  archiveplayer-data:
