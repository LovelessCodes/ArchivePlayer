[package]
name = "archiveplayer"
version = "0.3.0"
description = "A local-first media library for Archive.org"
authors = ["Jeppe Kjeldal and ArchivePlayer contributors"]
license = "MIT"
repository = "https://github.com/LovelessCodes/ArchivePlayer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "archiveplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
archiveplayer-core = { path = "../crates/archiveplayer-core" }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
url.workspace = true
