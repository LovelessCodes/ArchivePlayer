[workspace]
resolver = "2"
members = ["crates/archiveplayer-core", "crates/archiveplayer-server", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LovelessCodes/ArchivePlayer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
