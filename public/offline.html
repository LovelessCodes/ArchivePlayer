<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Offline · ArchivePlayer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Geist Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b0b0d;
        color: #f5f5f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(2rem, env(safe-area-inset-top)) 1.25rem
          max(2rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 20% 10%, rgb(200 16 46 / 16%), transparent 38rem),
          radial-gradient(circle at 85% 90%, rgb(80 60 180 / 13%), transparent 34rem),
          #0b0b0d;
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border-radius: 0.9rem;
        background: #e11d38;
        box-shadow: 0 0 40px -10px #e11d38;
      }
      .mark svg {
        width: 1.35rem;
        height: 1.35rem;
        margin-left: 0.15rem;
      }
      .eyebrow {
        margin: 0 0 0.6rem;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a1a1aa;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 7vw, 2.4rem);
        line-height: 1.1;
        letter-spacing: -0.035em;
      }
      p {
        margin: 1rem auto 0;
        max-width: 22rem;
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.65;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.75rem;
        height: 2.6rem;
        padding: 0 1.25rem;
        border-radius: 0.65rem;
        background: #f5f5f6;
        color: #0b0b0d;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
      }
      .button:hover {
        background: #d4d4d8;
      }
      footer {
        margin-top: 2.5rem;
        color: #71717a;
        font-size: 0.7rem;
        line-height: 1.6;
      }
      footer a {
        color: #d4d4d8;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.5v13l11-6.5z" />
        </svg>
      </div>
      <p class="eyebrow">ArchivePlayer</p>
      <h1>You're offline.</h1>
      <p>
        The app shell is still here, but your library and Archive.org streams need a
        connection. Reconnect, then try again.
      </p>
      <a class="button" href="/">Try again</a>
      <footer>
        A local-first library for
        <a href="https://archive.org">Archive.org</a>. Not affiliated with the Internet
        Archive.
      </footer>
    </main>
  </body>
</html>
