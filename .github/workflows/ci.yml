name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          # GitHub's runner image can temporarily fail to resolve its Azure
          # apt mirror. Fall back to the upstream Ubuntu mirror.
          mirror=archive.ubuntu.com
          if ! getent hosts "$mirror" >/dev/null 2>&1; then
            mirror=mirrors.edge.kernel.org
          fi
          sudo sed -i "s|azure.archive.ubuntu.com|$mirror|g" /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrades 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o DPkg::Lock::Timeout=120 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o DPkg::Lock::Timeout=120 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm check

      - name: Lint frontend
        run: pnpm lint

      # Build before compiling Tauri so tauri-build can see frontendDist.
      - name: Build frontend
        run: pnpm build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace
